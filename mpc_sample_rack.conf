# mpc-addin-sample-rack settings (key=value; this file sits next to mpc_sample_rack.so)
# enabled=0 leaves the addin loaded but idle: no RACK page.
enabled=1
# MPC's working copy of the open project, its settings (the plugins it knows) and its service (restarted by APPLY).
project=/data/TempProjects/Temp-Project.xpj
settings=/data/Settings/Akai/MPC Sample/MPC Sample.settings
service=ac50.service
